<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Council (demo)</title>
<style>
  :root { --bg: #1e1f22; --panel: #2b2d31; --line: #3f4147; --text: #f2f3f5; --dim: #b5bac1; --accent: #d4af37; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "gg sans", "Segoe UI", sans-serif; height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); }
  header .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #5865f2; }
  main { flex: 1; display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; min-height: 0; }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .filters { display: flex; gap: 8px; padding: 10px; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  input { flex: 1; }
  #count { font-size: 12px; color: var(--dim); padding: 0 12px 6px; }
  #list { overflow-y: auto; flex: 1; }
  .row { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; color: inherit;
         border: 0; border-bottom: 1px solid #26282c; padding: 7px 12px; cursor: pointer; font: inherit; }
  .row:hover { background: #2e3035; } .row.on { background: #393c43; }
  .meta { color: var(--dim); font-size: 12px; }
  .q-epic { color: #a335ee; } .q-rare { color: #3b8cff; } .q-legendary { color: #ff8000; }
  #detail { padding: 18px 22px; overflow-y: auto; }
  #detail h2 { margin: 0 0 4px; } #detail h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; margin-top: 22px; }
  .cand { display: grid; grid-template-columns: 170px 1fr 30px 70px; align-items: center; gap: 10px; padding: 6px 0; }
  .bar { height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .vote { background: #248046; color: #fff; border: 0; border-radius: 4px; padding: 5px 0; cursor: pointer; font: inherit; }
  .vote:hover { background: #1a6334; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 18px; }
  footer { padding: 6px 16px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header><h1>Loot Council</h1><span class="tag">DEMO · fake data</span></header>
  <main>
    <section class="left">
      <div class="filters"><input id="search" placeholder="Search 4,000 items or a slot..."><select id="raid"><option value="">All raids</option></select></div>
      <div id="count"></div>
      <div id="list"></div>
    </section>
    <section id="detail"></section>
  </main>
  <footer id="status">Starting...</footer>
  <script type="module" src="main.js"></script>
</body>
</html>
